# ============================================================
# Ejecuta LOCALMENTE la MISMA imagen que se despliega en Render.
#
# Por defecto la app apunta a la BD EXTERNA definida en backend/.env
# (copia backend/.env.example -> backend/.env y completa DB_*, JWT_*,
# USER_*):
#
#   docker compose up --build            # http://localhost:10000
#   curl -i http://localhost:10000/api/health
#
# Perfil opcional "db-local" (desactivado por defecto): PostgreSQL 17 en
# contenedor y una segunda instancia de la app conectada a el en el puerto
# 10001. Flyway crea el esquema "app" en el primer arranque:
#
#   docker compose --profile db-local up --build postgres app-db-local
#   docker compose exec postgres psql -U app hehiachi_mishima   # consola SQL
# ============================================================

x-app: &app
  image: acceso-base:local
  build:
    context: .
    dockerfile: Dockerfile
  init: false              # supervisord ya es el PID 1
  read_only: true          # solo /run/app y /tmp son escribibles
  tmpfs:
    - /run/app:uid=10001,gid=10001,mode=0700
    - /tmp:uid=10001,gid=10001
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 60s   # >= 15 s (nginx) + 30 s (backend) de supervisord
  mem_limit: 512m          # mismo techo que el plan free/starter de Render
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: true

services:
  app:
    <<: *app
    environment:
      PORT: "10000"
      BACKEND_PORT: "2003"
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "10000:10000"

  # ---------------- Perfil opcional: BD local ----------------
  postgres:
    image: postgres:17-alpine
    profiles: ["db-local"]
    environment:
      POSTGRES_DB: hehiachi_mishima
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local}
      TZ: UTC
    # pg_stat_statements para auditar consultas (skill jus-stack / pg_health.sql).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hehiachi_mishima"]
      interval: 5s
      timeout: 5s
      retries: 30

  app-db-local:
    <<: *app
    profiles: ["db-local"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "10000"
      BACKEND_PORT: "2003"
      SPRING_PROFILES_ACTIVE: prod
      DB_CONEXION: ""
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: hehiachi_mishima
      DB_USER: app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app-local}
      DB_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: http://localhost:10001
    ports:
      - "10001:10000"

volumes:
  postgres-data:
