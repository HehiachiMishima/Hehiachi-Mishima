; ============================================================
; supervisord = PID 1 del contenedor (recoge zombis y reenvia
; SIGTERM). Corre como el usuario NO root "app" (USER del Dockerfile).
;
; Orden: arranca por priority ascendente y PARA en orden inverso:
;   arranque: backend (10) -> nginx (20)
;   parada:   nginx (SIGQUIT = drenado ordenado) -> backend (SIGTERM =
;             server.shutdown=graceful de Spring).
; Presupuesto de parada: 15 s nginx + 30 s backend = 45 s, por debajo de
; maxShutdownDelaySeconds (60) de render.yaml y stop_grace_period del compose.
; ============================================================
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
pidfile=/run/app/supervisord.pid

[unix_http_server]
file=/run/app/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/app/supervisor.sock

[program:backend]
command=/usr/local/bin/run-backend
directory=/app
priority=10
autostart=true
autorestart=true
; Spring + Hibernate tardan en un plan con 0.1 CPU: se considera "arrancado"
; tras 20 s vivo. 5 reintentos fallidos seguidos => FATAL => el listener
; termina el contenedor y Render/Docker lo reinician (en vez de quedar un
; nginx sirviendo 503 para siempre).
startsecs=20
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/run-nginx
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
; SIGQUIT = graceful shutdown de nginx (termina las peticiones en curso).
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:salida_si_fatal]
command=/usr/local/bin/supervisor-fatal-listener
events=PROCESS_STATE_FATAL
priority=1
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
