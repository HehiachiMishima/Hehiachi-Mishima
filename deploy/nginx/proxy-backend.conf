# Proxy comun hacia Spring Boot (incluido por /api y /actuator/health).
proxy_pass http://backend;
proxy_http_version 1.1;

proxy_set_header Host              $host_original;
# $remote_addr ya es la IP real del cliente (real_ip, ver realip.conf). Se
# SOBRESCRIBE X-Forwarded-For en lugar de anexar: el backend (Tomcat
# RemoteIpValve) no puede ser engañado con un XFF falsificado por el cliente.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $proto_cliente;
proxy_set_header X-Forwarded-Host  $host_original;
proxy_set_header X-Forwarded-Port  $puerto_original;
proxy_set_header X-Request-Id      $req_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $conexion_backend;

proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
# Exportaciones CSV en streaming (chunked): entregar sin acumular.
proxy_buffering off;
proxy_request_buffering on;

# nginx es la unica fuente de cabeceras de seguridad (evita duplicados con
# las que añade Spring Security). X-Request-Id lo devuelve el backend.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Content-Security-Policy;
include /run/app/nginx/headers-common.conf;
# Respuestas JSON/CSV: nada que ejecutar ni embeber.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

# Backend caido o arrancando => 503 JSON (en lugar del 502 HTML de nginx).
proxy_intercept_errors off;
error_page 502 503 504 = @backend_no_disponible;
