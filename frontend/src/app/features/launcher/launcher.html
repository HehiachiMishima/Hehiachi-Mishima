<div class="launcher">
  <header class="launcher__topbar">
    <div class="launcher__brand">
      <span class="launcher__brand-mark"><img src="logo_hacker.png" alt="" width="24" height="24"></span>
      <span class="launcher__brand-name">Hehiachi Mishima</span>
    </div>

    <div class="launcher__actions">
      <button
        type="button"
        class="ui-icon-btn"
        (click)="alternarTema($event)"
        [attr.aria-label]="tema.tema() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      >
        <ui-icon [name]="tema.tema() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
      <app-menu-cuenta />
    </div>
  </header>

  <main id="contenido" class="launcher__main" tabindex="-1">
    <div class="launcher__intro">
      <p class="launcher__eyebrow">Panel de acceso</p>
      <h1 class="launcher__title" tabindex="-1">¿A dónde quieres ir?</h1>
      <p class="launcher__subtitle">
        Tienes acceso a <strong>{{ accesibles() }}</strong> de {{ paneles.length }} {{ paneles.length === 1 ? 'panel' : 'paneles' }}.
      </p>
    </div>

    <div class="launcher__grid">
      @for (panel of paneles; track panel.id) {
        <button
          type="button"
          class="panel-card"
          [class.panel-card--locked]="!accesible(panel)"
          [attr.aria-disabled]="!accesible(panel)"
          (click)="abrir(panel)"
        >
          <span class="panel-card__glow" aria-hidden="true"></span>

          <span class="panel-card__head">
            <span class="panel-card__icon" aria-hidden="true"><ui-icon [name]="panel.icono" [size]="22" /></span>
            @if (!accesible(panel)) {
              <span class="panel-card__lock" aria-hidden="true"><ui-icon name="lock" [size]="16" /></span>
            } @else {
              <span class="panel-card__open" aria-hidden="true"><ui-icon name="chevronRight" [size]="18" /></span>
            }
          </span>

          <span class="panel-card__name">{{ panel.nombre }}</span>
          <span class="panel-card__desc">{{ panel.descripcion }}</span>

          <span class="panel-card__meta">
            <span class="ui-badge" [class]="accesible(panel) ? 'ui-badge--success' : 'ui-badge--neutral'">
              <span class="ui-dot" aria-hidden="true"></span>
              {{ accesible(panel) ? 'Disponible' : 'Bloqueado' }}
            </span>
          </span>
        </button>
      }
    </div>
  </main>
</div>
