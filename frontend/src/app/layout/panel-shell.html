<header class="topbar">
  @if (!escritorio()) {
    <button
      #botonMenu
      type="button"
      class="cell cell--icono menu-toggle"
      (click)="alternarMenu()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="shell-nav"
    >
      <ui-icon [name]="menuAbierto() ? 'close' : 'menu'" [size]="20" />
    </button>
  }

  <button type="button" class="cell marca" [cdkMenuTriggerFor]="menuPaneles" aria-haspopup="menu">
    <span class="marca__mark" aria-hidden="true"><ui-icon [name]="panel.icono" [size]="16" /></span>
    <span class="marca__texto">
      <span class="marca__eyebrow">Panel</span>
      <span class="marca__nombre">{{ panel.nombre }}</span>
    </span>
    <ui-icon class="marca__chevron" name="chevronDown" [size]="16" />
    <span class="u-sr-only">, cambiar de panel</span>
  </button>

  <app-breadcrumbs class="migas" [items]="migas()" />

  <div class="topbar__fin">
    <button
      type="button"
      class="cell buscar"
      (click)="abrirPaleta()"
      aria-haspopup="dialog"
      [attr.aria-keyshortcuts]="atajoTexto === '⌘K' ? 'Meta+K' : 'Control+K'"
    >
      <ui-icon name="search" [size]="16" />
      <span class="buscar__texto">Ir a un módulo…</span>
      <kbd class="buscar__kbd" aria-hidden="true">{{ atajoTexto }}</kbd>
      <span class="u-sr-only">Buscar módulo</span>
    </button>
    <button
      type="button"
      class="cell cell--icono"
      (click)="alternarTema($event)"
      [attr.aria-label]="tema.tema() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <ui-icon [name]="tema.tema() === 'dark' ? 'sun' : 'moon'" [size]="16" />
    </button>
    <app-menu-cuenta />
  </div>
</header>

<ng-template #menuPaneles>
  <div appMenu class="menu-paneles">
    @for (p of paneles(); track p.id) {
      <button appMenuItem [selected]="p.id === panel.id" (cdkMenuItemTriggered)="irA(urlPanel(p))">
        <ui-icon [name]="p.icono" [size]="16" />
        <span class="menu-paneles__texto">
          <span>{{ p.nombre }}</span>
          <span class="menu-paneles__desc">{{ p.descripcion }}</span>
        </span>
      </button>
    }
    <app-menu-separator />
    <button appMenuItem (cdkMenuItemTriggered)="irA('/paneles')">
      <ui-icon name="layers" [size]="16" />
      Todos los paneles
    </button>
  </div>
</ng-template>

<nav
  #navegacion
  id="shell-nav"
  class="sidebar"
  [class.is-open]="menuAbierto()"
  aria-label="Módulos"
  [attr.inert]="escritorio() || menuAbierto() ? null : ''"
>
  @for (grupo of grupos(); track grupo.id) {
    <div class="grupo">
      <span class="grupo__label" [id]="'nav-grupo-' + grupo.id">{{ grupo.nombre }}</span>
      <ul [attr.aria-labelledby]="'nav-grupo-' + grupo.id">
        @for (modulo of grupo.modulos; track modulo.id) {
          <li>
            <a
              [routerLink]="urlModulo(panel, modulo)"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              (click)="alNavegar()"
            >
              <ui-icon [name]="modulo.icono" [size]="16" />
              <span>{{ modulo.nombre }}</span>
            </a>
          </li>
        }
      </ul>
    </div>
  }

  <div class="grupo grupo--pie">
    <ul>
      <li>
        <a routerLink="/paneles" (click)="alNavegar()">
          <ui-icon name="layers" [size]="16" />
          <span>Todos los paneles</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

@if (!escritorio() && menuAbierto()) {
  <div class="velo" aria-hidden="true" (click)="cerrarMenu()"></div>
}

<main id="contenido" class="contenido" tabindex="-1" [attr.inert]="!escritorio() && menuAbierto() ? '' : null">
  <router-outlet />
</main>

<app-paleta-modulos [abierta]="paletaAbierta()" (cerrar)="paletaAbierta.set(false)" />
