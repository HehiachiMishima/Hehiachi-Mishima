# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# ============================================================
# Blueprint de Render: UN servicio web Docker (Dockerfile de la raiz)
# con frontend (Angular + nginx) y backend (Spring Boot) en la misma
# imagen, y una base de datos Render PostgreSQL declarada en el mismo
# blueprint (sus credenciales se inyectan con fromDatabase).
#
# Desplegar:
#   1. Sube el repo a GitHub (rama indicada en "branch").
#   2. Render: New + > Blueprint > selecciona el repositorio.
#   3. Completa los valores "sync: false" (administrador semilla...).
#   4. Nada mas: Flyway crea el esquema "app" en el primer arranque
#      (backend/src/main/resources/db/migration).
# ============================================================

services:
  - type: web
    name: hehiachi-mishima
    runtime: docker
    plan: free                      # 512 MB / 0.1 CPU. starter: 512 MB / 0.5 CPU.
    region: oregon
    # Rama que dispara los despliegues. Hoy el repo solo tiene
    # "hehiachi_mishima" en origin; cambiala a "main" cuando exista.
    branch: hehiachi_mishima
    autoDeployTrigger: commit       # o "checksPass" para esperar al CI de GitHub
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # SIGTERM -> SIGKILL. supervisord necesita hasta 45 s (nginx 15 + backend 30).
    maxShutdownDelaySeconds: 60
    envVars:
      # --- Red ---
      # Render inyecta PORT=10000; nginx escucha ahi. El backend solo en
      # 127.0.0.1:BACKEND_PORT (nunca expuesto). Deben ser distintos.
      - key: PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "2003"
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Base de datos Render PostgreSQL (declarada abajo, en "databases") ---
      # Red privada de Render: host interno, sin salir a Internet.
      - key: DB_HOST
        fromDatabase: { name: hehiachi-mishima-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: hehiachi-mishima-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: hehiachi-mishima-db, property: database }
      - key: DB_USER
        fromDatabase: { name: hehiachi-mishima-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: hehiachi-mishima-db, property: password }
      # Dentro de la red privada de Render basta "prefer"; desde fuera usa
      # require o verify-full.
      - key: DB_SSLMODE
        value: "prefer"
      # Pool fijo por instancia (el plan free admite ~100 conexiones).
      - key: DB_POOL
        value: "5"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "15000"

      # --- Seguridad ---
      - key: JWT_SECRET
        generateValue: true         # 256 bits aleatorios generados por Render
      - key: JWT_ISSUER
        value: "hehiachi-mishima"
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      # SPA y API comparten origen (nginx), asi que CORS no interviene en el
      # navegador. Lista separada por comas; pon la URL real del servicio
      # (o tu dominio propio) si cambia.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hehiachi-mishima.onrender.com"

      # --- JVM: dimensionada para 512 MB (ver Dockerfile). Con >= 2 GB:
      # -XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+ExitOnOutOfMemoryError"

      # --- Usuario administrador semilla (se crea al arrancar si no existe) ---
      - key: USER_ADMIN
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false
      - key: USER_LASTNAME
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PHONE
        sync: false
      - key: USER_ACTIVO
        value: "TRUE"
      - key: USER_ROL
        value: "ADMINISTRADOR"

databases:
  - name: hehiachi-mishima-db
    plan: free                      # caduca a los 30 dias en Render; usa basic-256mb para produccion
    region: oregon                  # misma region que el servicio (red privada)
    databaseName: hehiachi_mishima
    user: hehiachi
    postgresMajorVersion: "17"
    ipAllowList: []                 # solo red privada de Render
