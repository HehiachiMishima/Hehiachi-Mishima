# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# ============================================================
# Blueprint de Render: UN servicio web Docker (Dockerfile de la raiz)
# con frontend (Angular + nginx) y backend (Spring Boot) en la misma
# imagen. La base de datos es EXTERNA (Aiven/MySQL): no se declara aqui.
#
# Desplegar:
#   1. Sube el repo a GitHub (rama indicada en "branch").
#   2. Render: New + > Blueprint > selecciona el repositorio.
#   3. Completa los valores "sync: false" (BD, administrador semilla...).
#   4. Aplica backend/schema.sql (y protection.admin.sql) en la BD externa
#      ANTES del primer arranque.
# ============================================================

services:
  - type: web
    name: hehiachi-mishima
    runtime: docker
    plan: free                      # 512 MB / 0.1 CPU. starter: 512 MB / 0.5 CPU.
    region: oregon
    # Rama que dispara los despliegues. Hoy el repo solo tiene
    # "hehiachi_mishima" en origin; cambiala a "main" cuando exista.
    branch: hehiachi_mishima
    autoDeployTrigger: commit       # o "checksPass" para esperar al CI de GitHub
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # SIGTERM -> SIGKILL. supervisord necesita hasta 45 s (nginx 15 + backend 30).
    maxShutdownDelaySeconds: 60
    envVars:
      # --- Red ---
      # Render inyecta PORT=10000; nginx escucha ahi. El backend solo en
      # 127.0.0.1:BACKEND_PORT (nunca expuesto). Deben ser distintos.
      - key: PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "2003"
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Base de datos EXTERNA (Aiven / MySQL 8) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Parametros JDBC. Aiven exige TLS. Para verificar la CA ademas del
      # cifrado, define DB_CA_CERT y usa:
      #   sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/run/app/db-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&serverTimezone=UTC
      - key: DB_PARAMS
        value: "sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=5000"
      # (Opcional) PEM de la CA de Aiven (contenido de ca.pem). El entrypoint
      # lo convierte en /run/app/db-truststore.p12. Dejalo vacio si no se usa.
      - key: DB_CA_CERT
        sync: false
      # Tamaño del pool Hikari (Aiven free admite pocas conexiones). Requiere
      # spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5} en el perfil prod.
      - key: DB_POOL_MAX
        value: "5"

      # --- Seguridad ---
      - key: JWT_SECRET
        generateValue: true         # 256 bits aleatorios generados por Render
      - key: JWT_ISSUER
        value: "hehiachi-mishima"
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      # SPA y API comparten origen (nginx), asi que CORS no interviene en el
      # navegador. Lista separada por comas; pon la URL real del servicio
      # (o tu dominio propio) si cambia.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hehiachi-mishima.onrender.com"

      # --- JVM: dimensionada para 512 MB (ver Dockerfile). Con >= 2 GB:
      # -XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+ExitOnOutOfMemoryError"

      # --- Usuario administrador semilla (se crea al arrancar si no existe) ---
      - key: USER_ADMIN
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: USER_NAME
        sync: false
      - key: USER_LASTNAME
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: USER_PHONE
        sync: false
      - key: USER_ACTIVO
        value: "TRUE"
      - key: USER_ROL
        value: "ADMINISTRADOR"
