spring.application.name=backend

# Las credenciales se cargan desde .env con DotenvEnvironmentPostProcessor
# (valores crudos). Se pueden sobrescribir con variables de entorno o
# argumentos --spring... sin tocar este archivo.

server.port=${BACKEND_PORT:2003}

# Detras del proxy de nginx (mismo contenedor): confia en X-Forwarded-*.
# Sin esto, getRemoteAddr() siempre seria 127.0.0.1 y el rate-limit de login
# por IP queda inutil (cubo unico compartido por todos los clientes). nginx
# sobrescribe X-Forwarded-For con la IP real ya resuelta (anti-spoofing).
server.forward-headers-strategy=native

# ============================================
# Datasource PostgreSQL (conexiones multiples conmutables)
# DB_CONEXION=<NOMBRE> elige el bloque DB_<NOMBRE>_* del .env/entorno
# (DotenvEnvironmentPostProcessor lo traduce a DB_HOST, DB_PORT...).
# Variables DB_* directas (p. ej. en Render) siempre ganan.
#
# currentSchema incluye los schemas del script SQL (seguridad, comun,
# bitacora) para que Hibernate resuelva "usuarios" como "seguridad.usuarios"
# sin calificar cada entidad con @Table(schema = ...).
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=seguridad,comun,bitacora,public&sslmode=${DB_SSLMODE:prefer}&reWriteBatchedInserts=true&ApplicationName=hehiachi-mishima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Tope por sentencia en el servidor: una consulta desbocada no retiene la conexion.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:15000} -c idle_in_transaction_session_timeout=60000

# Pool fijo (min = max): sin picos de conexiones nuevas bajo carga.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:20}
spring.datasource.hikari.minimum-idle=${DB_POOL:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ============================================
# Rendimiento / concurrencia (~1000 req/s)
# ============================================
spring.threads.virtual.enabled=true
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20s

# ============================================
# Seguridad: JWT (el secreto vive en .env como JWT_SECRET)
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.issuer=${JWT_ISSUER:hehiachi-mishima}

# ============================================
# CORS (frontend Angular). Lista separada por comas.
# En desarrollo Angular corre en http://localhost:4200.
# Sobrescribible con CORS_ALLOWED_ORIGINS en .env / entorno.
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.max-age=3600

# ============================================
# Seguridad de cuentas
# ============================================
# Coste BCrypt (10 = ~100 ms en una CPU normal; cada +1 duplica el tiempo).
app.seguridad.bcrypt-coste=${BCRYPT_COSTE:10}
# Bloqueo por cuenta: desde el fallo N se bloquea 1, 2, 4... min (tope en minutos).
app.seguridad.bloqueo.umbral=${LOGIN_BLOQUEO_UMBRAL:5}
app.seguridad.bloqueo.max-minutos=${LOGIN_BLOQUEO_MAX_MINUTOS:60}
# Usuarios protegidos ADEMAS de @hehiachi y del usuario semilla (lista por comas).
app.seguridad.usuarios-protegidos=${USUARIOS_PROTEGIDOS:}

# ============================================
# Bitacora de auditoria (escritura asincrona)
# ============================================
app.auditoria.capacidad-cola=${AUDITORIA_CAPACIDAD_COLA:10000}
app.auditoria.tamano-lote=200

# ============================================
# Monitoreo: metricas en memoria + traza de peticiones por usuario
# (bitacora.peticiones, escritura asincrona por lotes y purga por retencion).
# ============================================
app.monitoreo.persistir-peticiones=${MONITOREO_PERSISTIR:true}
app.monitoreo.retencion-dias=${MONITOREO_RETENCION_DIAS:30}
app.monitoreo.umbral-lento-ms=${MONITOREO_UMBRAL_LENTO_MS:1000}
app.monitoreo.capacidad-cola=${MONITOREO_CAPACIDAD_COLA:20000}
app.monitoreo.tamano-lote=500

# ============================================
# Dashboard: agregaciones globales cacheadas y con paralelismo acotado
# (debe quedar por debajo del pool de conexiones).
# ============================================
app.stats-cache.ttl-ms=${ANALITICA_CACHE_TTL_MS:120000}
app.analitica.paralelismo=${ANALITICA_PARALELISMO:4}

# ============================================
# Actuator (en desarrollo). En prod ver application-prod.properties.
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Elimina el usuario/password generado por Spring Security (sin bypass por defecto)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# No filtrar detalles internos en las respuestas de error
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ============================================
# Usuario semilla: se crea al arrancar si no existe (credenciales en .env)
# ============================================
app.seed.usuario=${USER_ADMIN}
app.seed.contrasena=${USER_PASSWORD}
app.seed.nombre=${USER_NAME}
app.seed.apellido=${USER_LASTNAME}
app.seed.email=${USER_EMAIL}
app.seed.telefono=${USER_PHONE}
app.seed.rol=${USER_ROL}
app.seed.activo=${USER_ACTIVO}