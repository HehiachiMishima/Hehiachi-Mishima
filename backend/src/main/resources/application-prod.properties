# ============================================================
# Perfil de produccion (SPRING_PROFILES_ACTIVE=prod, lo fija el Dockerfile).
# Contenedor unico en Render: nginx (PORT) -> Spring en 127.0.0.1:BACKEND_PORT.
# BD externa (Aiven/MySQL) con pocas conexiones disponibles.
# ============================================================

# --- Apagado ordenado: Render envia SIGTERM; supervisord espera 30 s al backend.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Detras de nginx (se conserva: IP real para rate limit y bitacora).
server.forward-headers-strategy=native

# --- Tomcat: con hilos virtuales el limite real es el pool de BD.
server.tomcat.threads.max=50

# --- Pool Hikari para plan pequeno (Aiven free admite pocas conexiones).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=60000

# --- Analitica: como mucho 2 conexiones para el dashboard (deja el resto al CRUD).
app.analitica.paralelismo=${ANALITICA_PARALELISMO:2}

# --- Logs JSON estructurados (ECS) en stdout. Incluyen el MDC (requestId).
logging.structured.format.console=ecs
logging.structured.ecs.service.name=hehiachi-mishima-backend
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# --- Actuator: solo health (+ probes liveness/readiness), sin detalles.
#     El health check de Render usa /api/health (SaludController, sin BD).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
